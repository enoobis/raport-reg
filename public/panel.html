<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>панель</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <img src="/logo.jpg" alt="it лицей 99" />
        <div>
          <strong>it лицей 99</strong>
          <span>панель управления</span>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="card" id="loginBox">
        <h1 class="page-title">вход</h1>
        <div class="row">
          <label for="pass">пароль</label>
          <input id="pass" type="password" />
        </div>
        <div class="actions actions-one">
          <button class="btn" id="loginBtn" type="button">войти</button>
        </div>
        <div id="loginMsg"></div>
      </div>

      <div id="desk" style="display: none">
        <div class="card">
          <h1 class="page-title" id="formHeading">новое мероприятие</h1>
          <input type="hidden" id="editId" value="" />
          <div class="row">
            <label for="title">название *</label>
            <input id="title" maxlength="100" required />
          </div>
          <div class="row">
            <label for="ends">конец регистрации *</label>
            <input id="ends" type="datetime-local" required />
          </div>
          <div class="actions">
            <button class="btn" id="createBtn" type="button">создать</button>
            <button class="btn ghost" id="cancelEdit" type="button" style="display: none">
              отмена
            </button>
          </div>
          <div id="createMsg"></div>
        </div>

        <div class="card">
          <h2 class="section-title">мероприятия</h2>
          <div id="events"></div>
        </div>

        <div class="card">
          <h2 class="section-title">записи</h2>
          <div class="filters">
            <select id="eventFilter">
              <option value="">все мероприятия</option>
            </select>
            <input id="search" placeholder="поиск по фио, группе, проекту" />
            <div class="filters-row">
              <button class="btn ghost" id="searchBtn" type="button">найти</button>
              <button class="btn" id="exportBtn" type="button">скачать txt</button>
            </div>
          </div>
          <div id="regs"></div>
        </div>

        <footer class="footer" style="padding-left: 0; padding-right: 0">
          <a href="/">на сайт</a> ·
          <a href="#" id="logout">выйти</a>
        </footer>
      </div>
    </main>

    <script src="/app.js"></script>
    <script>
      loadAdmin();
    </script>
  </body>
</html>
