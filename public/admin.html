<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>админ</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="banner">
        <h1>★ админ панель ★</h1>
      </div>

      <div class="panel" id="loginBox">
        <h2>вход</h2>
        <div class="row">
          <label for="pass">пароль</label>
          <input id="pass" type="password" />
        </div>
        <button class="btn" id="loginBtn" type="button">войти</button>
        <div id="loginMsg"></div>
      </div>

      <div id="desk" style="display: none">
        <div class="panel">
          <h2>новое мероприятие</h2>
          <div class="row">
            <label for="title">название</label>
            <input id="title" maxlength="100" />
          </div>
          <div class="row">
            <label for="ends">конец регистрации</label>
            <input id="ends" type="datetime-local" />
          </div>
          <button class="btn green" id="createBtn" type="button">создать</button>
          <div id="createMsg"></div>
        </div>

        <div class="panel">
          <h2>мероприятия</h2>
          <div id="events"></div>
        </div>

        <div class="panel">
          <h2>записи</h2>
          <div class="top">
            <select id="eventFilter">
              <option value="">все</option>
            </select>
            <input id="search" placeholder="поиск: фио / группа / телефон" />
            <button class="btn" id="searchBtn" type="button">найти</button>
            <button class="btn green" id="exportBtn" type="button">txt</button>
          </div>
          <div id="regs"></div>
        </div>

        <div class="footer">
          <a href="/">на сайт</a> ·
          <a href="#" id="logout">выйти</a>
        </div>
      </div>
    </div>
    <script src="/app.js"></script>
    <script>
      loadAdmin();
    </script>
  </body>
</html>
