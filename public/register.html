<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>запись</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <img src="/logo.jpg" alt="it лицей 99" />
        <div class="brand-text">
          <strong>it лицей 99</strong>
          <span>при президенте кр</span>
        </div>
      </div>

      <div class="banner">
        <h1>запись на рапорт</h1>
        <div class="sub">заполни все поля — заявка уйдёт сразу в список</div>
      </div>

      <div class="panel">
        <h2 id="title">загрузка...</h2>
        <p class="muted" id="until"></p>

        <form id="form">
          <div class="row">
            <label for="fio">фио *</label>
            <input id="fio" name="fio" required maxlength="120" autocomplete="name" />
          </div>
          <div class="row">
            <label for="group">группа *</label>
            <input id="group" name="group" required maxlength="40" />
          </div>
          <div class="row">
            <label for="phone">номер телефона *</label>
            <input
              id="phone"
              name="phone"
              required
              maxlength="30"
              inputmode="tel"
              autocomplete="tel"
            />
          </div>
          <div class="row">
            <label for="projectTitle">название проекта *</label>
            <input id="projectTitle" name="projectTitle" required maxlength="160" />
          </div>
          <div class="row">
            <label for="projectDesc">описание проекта *</label>
            <textarea id="projectDesc" name="projectDesc" required maxlength="2000" rows="4"></textarea>
          </div>
          <div class="top" style="margin-top: 12px">
            <button class="btn" type="submit">зарегистрироваться</button>
            <a class="btn ghost" href="/">назад</a>
          </div>
        </form>
        <div id="msg"></div>
      </div>
    </div>
    <script src="/app.js"></script>
    <script>
      loadRegister();
    </script>
  </body>
</html>
